version: '3.8'

services:
  db:
    image: postgres:15
    container_name: fiber_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  app:
    build: .
    container_name: fiber_app
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PG_URL=${PG_URL}
      - DB_NAME=${DB_NAME}

volumes:
  db_data: